name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Google girisi SHA-1'e baglidir: her derlemede AYNI anahtar kullanilmali.
      # Anahtar repo secret'larindan gelir (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      - name: Keystore hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 tanimli degil; release APK debug keystore ile imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK derle (release, imzali)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Anonymous.apk olarak adlandir
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -f "$APK" || { echo "::error::APK bulunamadi"; exit 1; }
          cp "$APK" Anonymous.apk
          echo "--- imza ---"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs Anonymous.apk | head -5

      - name: Surum numarasi
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi

      # Release'i otomatik olustur ve APK'yi ekle
      - name: Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Anonymous ${{ steps.ver.outputs.tag }}
          body: |
            **We are Anonymous.**
            Kararli surum. `Anonymous.apk` dosyasini indirip kurun.
          files: Anonymous.apk
          make_latest: true

      # Kapali kaynak: derleme bitince kaynak kodu repodan silinir (sadece README, lisans ve workflow kalir).
      # NOT: Bu adim SON adimdir. Silme basarili olursa bir sonraki derleme icin kaynak KALMAZ;
      # bu yuzden kaynak, 'source' adli ozel (private) yedek dala once kopyalanir.
      - name: Kaynagi yedekle ve depodan temizle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name  "anonymous-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin
          # 1) tam kaynagi 'source-backup' dalina it (bu dal PRIVATE depoda tutulmali)
          git push origin HEAD:refs/heads/source-backup --force
          # 2) main'den kaynak dosyalarini sil, sadece vitrin dosyalari kalsin
          git rm -r -q --ignore-unmatch android server
          git commit -q -m "chore: kaynak kodu kaldirildi (kapali kaynak)" || exit 0
          git push origin HEAD:main
